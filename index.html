<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="pictures/favicon.png">

<title>The Make & Take Archive (Austria, Germany and Switzerland)</title>

<style>
@font-face {
  font-family: "Alex Brush"; font-style: normal; font-weight: 400;
  src: url('fonts/regular.eot'); /* IE9 Compat Modes */
  src: url('fonts/regulard41d.eot?#iefix') format('embedded-opentype'), /* IE6-IE8 */
       url('fonts/regular.woff2') format('woff2'), /* Super Modern Browsers */
       url('fonts/regular.woff') format('woff'), /* Modern Browsers */
       url('fonts/regular.ttf') format('truetype'); /* Safari, Android, iOS */
}

  body { background: white; font-family: Arial, sans-serif; font-size: 16px; }
  h1 { font-family: "Alex Brush", Arial, Helvetica, sans-serif; font-size: 35px; margin: 0; padding: 0; text-align: center; }
  h3 { margin: 0; padding: 0; }
  a { color: #000; text-decoration: none; }
  a:hover { color: #E3000B; text-decoration: underline; }

  table { background: white; border-collapse: collapse; width: 100%; }
  #eventsTable tr:nth-child(even) { background: #fff8cc; }
  #eventsTable tr:nth-child(odd) { background: white; }
  #eventsTable tr:hover { background: #ffe44d; }
  #eventsTable th { background: #333; color: white; cursor: pointer; position: sticky; top: 0; z-index: 10; }
  #eventsTable th, #eventsTable td { border: 1px solid #ccc; padding: 4px; text-align: left; }
  #eventsTable th.center, #eventsTable td.center { text-align: center; }
  #eventsTable th.part-count, #eventsTable td.part-count { text-align: right; }
  #eventsTable th.instructions, #eventsTable td.instructions { text-align: right; }
  #eventsTable td.notes { white-space: pre-line; }

  .image-cell img { max-height: 100px; max-width: 100px; }

  #byline { color: #E3000B; font-family: 'Alex Brush'; font-size: 25px; font-weight: bold; text-align: center; }
  #status { font-family: 'Alex Brush'; font-size: 25px; font-weight: bold; text-align: right; }

  #controls { align-items: center; display: flex; gap: 10px; margin-bottom: 5px; }
  #searchWrapper { align-items: center; display: flex; flex: 1; position: relative; }
  #search { background: #fff8cc; border: 1px solid #000; box-sizing: border-box; font-size: 16px; height: 42px; padding: 10px; width: 100%; }
  #clearSearch { background: none; border: none; color: #000; cursor: pointer; display: none; font-size: 16px; line-height: 1; padding: 2px 4px; position: absolute; right: 8px; }
  #clearSearch:hover { color: #E3000B; }
  #fileSelect { background: #fff8cc; border: 1px solid #000; box-sizing: border-box; cursor: pointer; font-size: 16px; height: 42px; padding: 10px; }

  #imgOverlay { align-items: center; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; inset: 0; justify-content: center; position: fixed; z-index: 9999; }
  #imgOverlay img { max-height: 85vh; max-width: 95vw; }
  #imgOverlay .caption { color: #fff; font-size: 16px; margin-top: 2px; max-width: 95vw; text-align: center; }
  #imgOverlay .caption a { color: #cff; }
  #imgOverlay .caption a:hover { color: #E3000B; text-decoration: underline; }

  #lsupdate { font-family: 'Alex Brush'; font-size: 25px; font-weight: bold; margin: 10px 0; text-align: center; }
  #footer { margin-top: 15px; text-align: center; }

@media (max-width: 700px) {
  #eventsTable thead { display:none; }

  #eventsTable,
  #eventsTable tbody,
  #eventsTable tr,
  #eventsTable td { display:block; width:100%; box-sizing:border-box; }

  #eventsTable tr { border:2px solid #333; margin-bottom:12px; }
  #eventsTable td { border:none; padding:4px 8px; text-align:left !important; }

  #eventsTable td.center,
  #eventsTable td.part-count,
  #eventsTable td.instructions { text-align:left !important; }

  #eventsTable td.image-cell { text-align:center !important; }

  #eventsTable td:nth-child(1)::before { content:"Date: "; font-weight:bold; }
  #eventsTable td:nth-child(2)::before { content:"Organizer: "; font-weight:bold; }
/*  we dont need the text image in this view mode #eventsTable td:nth-child(3)::before { content:"Image:"; display:block; font-weight:bold; } */
  #eventsTable td:nth-child(3)::before { content:none; display:block; font-weight:bold; } 
  #eventsTable td:nth-child(4)::before { content:"Model: "; font-weight:bold; }
  #eventsTable td:nth-child(5)::before { content:"Theme & Notes: "; font-weight:bold; }
  #eventsTable td:nth-child(6)::before { content:"Part Count: "; font-weight:bold; }
  #eventsTable td:nth-child(7)::before { content:"Instructions: "; font-weight:bold; }

  #eventsTable td.notes { white-space: normal; }

  .image-cell img { max-width:100%; height:auto; }

}

</style></head>

<body>
<h1>The Make & Take Archive for Austria, Germany and Switzerland</h1>

<div id="byline">
Unofficialy fan archive!
<svg width="20" height="20" viewBox="0 0 20 20" style="cursor:pointer; vertical-align:middle;" onclick="openText('What is a Make & Take Event?')">
  <title>What is a Make & Take Event?</title>
  <circle cx="10" cy="10" r="10" fill="#0066cc"/>
  <text x="10" y="15" text-anchor="middle" fill="white" font-size="13" font-family="serif" font-weight="bold">i</text>
</svg>
<a target="_blank" title="ADMIN" id="adminBtn" href="admin.html" style="display:none;">
<svg width="20" height="20" viewBox="0 0 20 20" style="vertical-align:middle;">
  <circle cx="10" cy="10" r="10" fill="#E3000B"/>
  <text x="10" y="15" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">A</text>
</svg>
</a>
</div>
<div id="status">Loading data...</div>

<div id="controls">
    <div id="searchWrapper">
        <input type="text" id="search" placeholder="Filter by...">
        <button id="clearSearch" title="Clear filter">✕</button>
    </div>
    <select id="fileSelect">
        <option value="data/mat.json" selected>Make and Take</option>
        <option value="data/mmmb.json">Monthly Mini Model Build</option>
        <option value="data/miscellaneous.json">Miscellaneous</option>
    </select>
</div>

<table id="eventsTable">
    <thead><tr> <!-- text between the th-tags is redundant and only a fallback when JS is disabled -->
        <th class="center" data-column="Date" data-label="Date (Y/M/D)">Date (Y/M/D)</th>
        <th class="center" data-column="Organizer" data-label="Organizer">Organizer</th>
        <th class="center" data-column="Image" data-label="Image">Image</th>
        <th data-column="Model" data-label="Model">Model</th>
        <th data-column="Notes" data-label="Theme & Notes">Theme & Notes</th>
        <th class="part-count" data-column="Part Count" data-label="Part Count">Part Count</th>
        <th class="instructions" data-column="Instructions" data-label="Number (Instructions)">Number (Instructions)</th>
    </tr></thead>
    <tbody></tbody>
</table>

<script>
let events = [];
let collection = {};
let currentSortColumn = 'Date';
let currentSortDirection = -1;

// load collection.json once on startup
fetch('data/collection.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => { collection = data; })
    .catch(() => { collection = {}; }); // silently fail if file doesn't exist yet

if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    document.getElementById('adminBtn').style.display = 'inline';
}

function loadFile(filename) {
    document.getElementById('status').textContent = `Loading file ${filename}...`;
    document.getElementById('search').value = '';
    document.getElementById('clearSearch').style.display = 'none';

    // map filename to collection key
    const keyMap = {
        'data/mat.json': 'mat',
        'data/mmmb.json': 'mmmb',
        'data/miscellaneous.json': 'miscellaneous'
    };
    window.currentCollectionKey = keyMap[filename] || 'mat';

    fetch(filename + '?_=' + Date.now())
        .then(response => {
            if (!response.ok) {
                throw new Error('I could not load file ' + filename + '!');
            }
            return response.json();
        })
        .then(data => {
            events = data;
            sortEvents(events);
            renderTable(events);
        })
        .catch(error => {
            document.getElementById('status').textContent =
                'Error: ' + error.message;
        });
}

loadFile(document.getElementById('fileSelect').value); // Load default file on page load

document.getElementById('fileSelect').addEventListener('change', function () {
    loadFile(this.value);
    this.blur();
});

function sortEvents(data) {
    data.sort((a, b) => {
        const aVal = a[currentSortColumn] || '';
        const bVal = b[currentSortColumn] || '';
        return aVal.toString().localeCompare(
            bVal.toString(),
            undefined,
            { numeric: true }
        ) * currentSortDirection;
    });
}

function renderTable(data) {
    document.getElementById('status').textContent = `Showing ${data.length-1} of ${events.length-1} events.`; // don't count the "last updated"-line

    const tbody = document.querySelector('#eventsTable tbody');
    tbody.innerHTML = '';

    data.forEach(event => {
        const row = document.createElement('tr');

        // check if this entry is in the collection
        const owned = event.Instructions &&
            (collection[window.currentCollectionKey] || []).some(n => event.Instructions.includes(n))
            ? '<span style="color:#00A650"> ✔</span>'
            : '';

        row.innerHTML = `
            <td class="center">${event.Date || ''}</td>
            <td class="center notes">${event.Organizer || ''}</td>
            <td class="image-cell center">${createImageCell(event.Image, event.Source)}</td>
            <td class="notes">${event.Model || ''}${owned}</td>
            <td class="notes">${event.Notes || ''}</td>
            <td class="part-count">${event["Part Count"] || ''}</td>
            <td class="instructions">${event.Instructions ? '📄 ' + event.Instructions : ''}</td>
        `;
        tbody.appendChild(row);
    });
}

function escapeAttr(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function createImageCell(value, source) {
    if (!value) return '';

    const lower = value.toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp)$/.test(lower))
    {
        const src = value.startsWith('https://') ? value : `pictures/${value}`;
        return `<img src="${src}" alt="" title="click image to enlarge" data-source="${escapeAttr(source || '')}" onclick="openImage(this.src, this.dataset.source)" style="cursor:pointer;">`;
    }
    return value;
}

function openImage(url, source){
    const captionHtml = source
        ? `<div class="caption">Source: <a href="${source}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${source}</a>↗</div>`
        : '';

    const overlay=document.createElement('div');
    overlay.innerHTML=`<div id="imgOverlay"><img src="${url}"> ${captionHtml}</div>`;
    document.body.appendChild(overlay);

    function closeOverlay(){
        document.removeEventListener('keydown', closeOverlay);
        overlay.remove();
    }

    document.addEventListener('keydown', closeOverlay);
    overlay.onclick=closeOverlay;
}

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearSearch');

function applySearch() {
    const search = searchInput.value.toLowerCase();
    clearBtn.style.display = search ? 'block' : 'none';
    const filtered = events.filter(event =>
        Object.values(event).some(value =>
            String(value).toLowerCase().includes(search)
        )
    );
    sortEvents(filtered);
    renderTable(filtered);
}

searchInput.addEventListener('input', applySearch);

searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && this.value) clearBtn.click();
});

clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    this.style.display = 'none';
    applySearch();
    searchInput.focus();
});

function updateSortHeaders() {
    document.querySelectorAll('th').forEach(th => {
        const col = th.dataset.column;
        if (!col) return;
        const label = th.dataset.label || col;
        if (col === currentSortColumn) {
            th.textContent = label + (currentSortDirection === 1 ? ' ▲' : ' ▼');
        } else {
            th.textContent = label;
        }
    });
}

// Show default sort indicator on startup
updateSortHeaders();

document.querySelectorAll('th').forEach(header => {
    header.addEventListener('click', () => {
        const column = header.dataset.column;
        if (currentSortColumn === column) {
            currentSortDirection *= -1;
        } else {
            currentSortColumn = column;
            currentSortDirection = 1;
        }
        updateSortHeaders();
        applySearch(); // re-apply current filter with new sort
    });
});

function openText(title) { // it's not perfect but its at least in there
let displaytext = `<h2>${title}</h2>`

if (title === "What is a Make & Take Event?") {
displaytext += `
&nbsp;A Make & Take Event is a limited-time in-store promotional<br>
activity where participants build a small exclusive bricks model<br>
&nbsp;and keep it free of charge. These events are typically<br>
&nbsp;offered on a first-come, first-served basis while supplies<br>
&nbsp;last and participation is usually limited to one model per<br>
&nbsp;person.&nbsp;<br><br>
&nbsp;In Austria, Germany and Switzerland, these events are commonly&nbsp;<br>
&nbsp;held on Wednesdays and Thursdays from 15:00 to 17:00 CET.&nbsp;<br>
&nbsp;Exact dates and times may vary depending on the event and the<br>
&nbsp;individual store.&nbsp;<br><br>
&nbsp;If you find a broken link, please email me at s`;
displaytext += ["i","r","_","s","i","l","v","a","@","g","m","x",".","d"].join("") + `e`;
}

else if (title === "Legal & Trademark Information") {

else if (title === "Sources") {
displaytext += `

<li>pdf.kids.lego.com — primary source for instructions</li>
<li>lego.com — primary source for imagery & proof of events</li>
<li>lego-asterix-apps-storage.s3.eu-central-1.amazonaws.com<br>— catbike & christmas (2023) instructions</li>
</ul><ul>
<li>Benkagan's google drive — witch (2025) instructions</li>
<li>brickshow.com — tree in the woods instructions</li>
<li>promobricks.de — two event pictures & four proofs of events</li>
<li>rebelscum.com — luke skywalker timeline instructions</li>
<li>rebrickable.com — pictures & instructions</li>
<li>stonewars.de — newsstand instructions</li>
<li>thebrickpost.com — mosaic & supply llama instructions</li>
<li>worldbricks.com — 3d easter egg (2025) instructions</li>
</ul>
asset integration method: external hotlinking
`;
}

    const overlay = document.createElement('div');
    overlay.innerHTML = `<div id="imgOverlay"><div style="font-family: Arial, sans-serif; font-size: 16px; text-align:left; background:#0066cc; color:#000; padding:8px;">
                         <div>${displaytext}</div></div></div>`;
    document.body.appendChild(overlay);

    function closeOverlay() {
        document.removeEventListener('keydown', closeOverlay);
        overlay.remove();
    }
    document.addEventListener('keydown', closeOverlay);
    overlay.onclick = closeOverlay;
}

</script>

</html>
