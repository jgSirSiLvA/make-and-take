<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="pictures/favicon.png">
    <title>LEGO Store Events Fetcher by Sir SiLvA</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f2; margin: 0; padding: 20px; color: #333; }
.grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; width: 100%; }
.store-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
.store-title { color: #E3000B; font-size: 1.25rem; font-weight: 700; margin: 0; }
.store-title-wrapper { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #ffd502; }
.store-link-icon { text-decoration: none; color: #E3000B; font-size: 1.5rem; line-height: 1; font-weight: bold; }
.event-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
.event-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.event-image { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background-color: #f8f8f8; }
.event-heading { font-size: 1.1rem; font-weight: 600; margin: 12px 0 6px 0; color: #000; }
.event-subheading { font-size: 0.95rem; color: #555; margin-bottom: 12px; line-height: 1.4; }
.event-link { display: inline-block; color: #005ad2; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
.event-link:hover { text-decoration: underline; }
.no-events { color: #777; font-style: italic; }
.error-msg { color: #d0021b; background: #ffe6e6; padding: 10px; border-radius: 4px; }
.loading { text-align: center; font-size: 1.2rem; color: #666; }
</style>

</head>
<body>

    <div id="app" class="loading">Fetching events from LEGO API...</div>

    <script>
        // The exact GraphQL Query and Fragments extracted from 614a6c2d78041e26.js
        const graphQLQuery = `
            fragment ImageAsset on ImageAssetDetails { url width height maxPixelDensity format }
            fragment StoreEventsDetail on StoreEvent { urlKey heading subHeading thumbnailImage { small { ...ImageAsset } large { ...ImageAsset } } }
            query StoreInfo($urlKey: String!) { storeInfo(urlKey: $urlKey) { name openingDate events { ...StoreEventsDetail } } }
        `;

        // The 15 stores requested - remember the , !!!
        const storesToFetch = [
            { slug: 'berlin', locale: 'de-de' },
            { slug: 'mall-of-berlin', locale: 'de-de' },
            { slug: 'hamburg', locale: 'de-de' },
            { slug: 'wien-donau-zentrum', locale: 'de-at' },
            { slug: 'glatt', locale: 'de-ch' },

            { slug: 'lsq', locale: 'en-gb' },
            { slug: 'blanchardstown-dublin-ireland', locale: 'en-gb' },
            { slug: 'barcelona', locale: 'es-es' },
            { slug: 'amsterdam', locale: 'de-de' },
            { slug: 'brussels', locale: 'de-de' },

            { slug: 'krakow', locale: 'de-de' },
            { slug: 'stockholm', locale: 'de-de' },
            { slug: '5th-avenue', locale: 'en-us' },
            { slug: 'fairview-mall', locale: 'en-us' },
            { slug: 'disneytown-shanghai', locale: 'en-gb' } // empty list 9/8/26
        ];

        const appContainer = document.getElementById('app');

        async function fetchStoreEvents(store) {
            try {
                // Hitting the exact endpoint found in the HTML file
                const response = await fetch('https://www.lego.com/api/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // User agent is sometimes required by CDNs to not block the request
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                    },
                    body: JSON.stringify({
                        query: graphQLQuery,
                        variables: { urlKey: store.slug }
                    })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                if (data.errors) {
                    return { error: 'Store not found or API error', name: store.slug };
                }

                //return { name: data.data.storeInfo.name || store.slug, slug: store.slug, events: data.data.storeInfo.events || [], locale: store.locale, error: null };
return { 
    name: data.data.storeInfo.name || store.slug, 
    openingDate: data.data.storeInfo.openingDate || null, 
    slug: store.slug, 
    events: data.data.storeInfo.events || [], 
    locale: store.locale, 
    error: null 
};

            } catch (error) {
                console.error(`Failed to fetch ${store.slug}:`, error);
                return { error: error.message, name: store.slug };
            }
        }

        function renderEvents(storeData) {
            const card = document.createElement('div');
            card.className = 'store-card';

            // Store Title & Link Wrapper
            const titleWrapper = document.createElement('div');
            titleWrapper.className = 'store-title-wrapper';
            const dateStr = storeData.openingDate ? ` (${storeData.openingDate}) ` : '';            
            const title = document.createElement('h2');
            title.className = 'store-title';
            title.innerText = storeData.name.replace(/LEGO[\s\u00A0\u200B-\u200D\uFEFF]*®?\s*Store\s*/gi, '').trim()+`${dateStr}`;
            
            const storeLink = document.createElement('a');
            storeLink.href = `https://www.lego.com/${storeData.locale}/stores/store/${storeData.slug}`;
            storeLink.target = '_blank';
            storeLink.className = 'store-link-icon';

            storeLink.innerText = ' ↗';
            
            titleWrapper.appendChild(title);
            titleWrapper.appendChild(storeLink);
            card.appendChild(titleWrapper);

            // Store Title
            //const title = document.createElement('h2');
            //title.className = 'store-title';
            //title.innerText = storeData.name.replace(/^.*?\bStore\s*/gi, ''); // removing 'LEGO® Store ' aka waste of space
            //card.appendChild(title);

            // Error Handling
            if (storeData.error) {
                const errDiv = document.createElement('div');
                errDiv.className = 'error-msg';
                errDiv.innerText = `Error: ${storeData.error}`;
                card.appendChild(errDiv);
                return card;
            }

            // No Events Handling
            if (!storeData.events || storeData.events.length === 0) {
                const noEvents = document.createElement('p');
                noEvents.className = 'no-events';
                noEvents.innerText = 'No current events for this store.';
                card.appendChild(noEvents);
                return card;
            }

            // Render Each Event (matches the logic in module 25446)
            storeData.events.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event-item';

                // Image (Using large, falling back to small)
                if (event.thumbnailImage) {
                    const rawUrl = event.thumbnailImage.large?.url || event.thumbnailImage.small?.url;
                    // Split at '?' and keep only the first part (index 0)
                    const imgUrl = rawUrl ? rawUrl.split('?')[0] : '';
                    if (imgUrl) {
                        const img = document.createElement('img');
                        img.className = 'event-image';
                        img.src = imgUrl;
                        img.alt = event.heading || 'Store Event';
                        img.loading = 'lazy';
                        eventDiv.appendChild(img);
                    }
                }

                // Heading
                if (event.heading) {
                    const h3 = document.createElement('div');
                    h3.className = 'event-heading';
                    h3.innerText = event.heading
                    eventDiv.appendChild(h3);
                }

                // SubHeading (Text) with <br> replacing
                if (event.subHeading) {
                    const p = document.createElement('div');
                    p.className = 'event-subheading';
                    // Replace all variations of <br> with a real \n line break
                    p.innerText = event.subHeading.replace(/<br\s*\/?>/gi, '\n');
                    eventDiv.appendChild(p);
                }

                // URL Link
                if (event.urlKey) {
                    const linkUrl = `https://www.lego.com/${storeData.locale}/stores/events/${event.urlKey}`; // source url doesnt change therefor hardcoded
                    const a = document.createElement('a');
                    a.className = 'event-link';
                    a.href = linkUrl;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerText = 'Learn More';
                    eventDiv.appendChild(a);
                }

                card.appendChild(eventDiv);
            });

            return card;
        }

        // Main execution
        async function init() {
            const gridContainer = document.createElement('div');
            gridContainer.className = 'grid-container';

            // Fetch all 4 stores simultaneously
            const results = await Promise.all(storesToFetch.map(store => fetchStoreEvents(store)));

            // Render the results to the DOM
            results.forEach(storeData => {
                gridContainer.appendChild(renderEvents(storeData));
            });

            // Replace loading text with the grid
            appContainer.innerHTML = '';
            appContainer.appendChild(gridContainer);
        }

        // Run the script
        init();
    </script>
</body>
</html>
