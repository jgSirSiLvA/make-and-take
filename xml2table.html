<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="pictures/favicon.png">
<title>xml2table by Sir SiLvA</title>
<style>
  table { border-collapse: collapse; font-family: Arial, sans-serif; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; }
  th { background: #eee; cursor: pointer; position: sticky; top: 0; z-index: 10; }
  th:hover { background: #ddd; }
  .size { text-align: right; }
</style>
</head><body>
<h1>pdf.kids-xml to table website</h1>
<button id="downloadXml">Download XML</button>(last update: 12.08.2026, #549 entries)<br><br>

<table id="table">
<tr>
  <th data-type="number">#</th>
  <th data-type="date">Date (D.M.Y)</th>
  <th data-type="text">URL</th>
  <th class="size" data-type="number">Size (MB)</th>
</tr>
</table>
<br><br><br>
<script>
(async () => {
  const response = await fetch("https://pdf.kids.lego.com/");
  const xmlText = await response.text();

  const xml = new DOMParser()
    .parseFromString(xmlText, "application/xml");

  let files = [...xml.querySelectorAll("Contents")]
    .map(item => {
      const rawDate = item.querySelector("LastModified")?.textContent;
      const size = Number(item.querySelector("Size")?.textContent || 0);

      return {
        rawDate: new Date(rawDate),
        date: new Date(rawDate).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }),
        url: "https://pdf.kids.lego.com/" + item.querySelector("Key")?.textContent,
        sizeMB: (size / 1024 / 1024).toFixed(2)
      };
    })
    .sort((a, b) => b.rawDate - a.rawDate); // newest first

  const table = document.getElementById("table");

files.forEach((file, index) => {
  const row = table.insertRow();
  const digits = String(files.length).length;
  row.insertCell().textContent = String(index + 1).padStart(digits, "0");
  row.insertCell().textContent = file.date;
  const linkCell = row.insertCell();
  const link = document.createElement("a");
  link.href = file.url;
  link.textContent = file.url;
  link.target = "_blank";
  linkCell.appendChild(link);
  const sizeCell = row.insertCell();
  sizeCell.textContent = file.sizeMB;
  sizeCell.className = "size";
});

document.getElementById("downloadXml").addEventListener("click", () => {
    const blob = new Blob([xmlText], { type: "application/xml" });
    const now = new Date();
    const filename = `pdf.kids.lego.com_${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}-${String(now.getMinutes()).padStart(2, "0")}-${String(now.getSeconds()).padStart(2, "0")}.xml`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  });
})();

document.querySelectorAll("#table th").forEach((header, columnIndex) => {
  let ascending = true;

  header.addEventListener("click", () => {
    const table = document.getElementById("table");
    const rows = Array.from(table.querySelectorAll("tr")).slice(1);
    const type = header.dataset.type;

    rows.sort((a, b) => {
      let A = a.cells[columnIndex].textContent.trim();
      let B = b.cells[columnIndex].textContent.trim();

      if (type === "number") {
        A = parseFloat(A);
        B = parseFloat(B);
      }
      else if (type === "date") {
        const [d1, m1, y1] = A.split(".");
        const [d2, m2, y2] = B.split(".");
        A = new Date(y1, m1 - 1, d1);
        B = new Date(y2, m2 - 1, d2);
      }
      else {
        A = A.toLowerCase();
        B = B.toLowerCase();
      }
      if (A < B) return ascending ? -1 : 1;
      if (A > B) return ascending ? 1 : -1;
      return 0;
    });

    rows.forEach(row => table.appendChild(row));
    ascending = !ascending;
  });
});
</script>
</body>
</html>
